<!DOCTYPE html>
<html>
<head>
    <title>RPG Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎮 RPG SYSTEM</h1>

    <div class="card">
        <h2>🧙 Status do Jogador</h2>
        <p>HP: {{ player.HP }}</p>
        <p>INT: {{ player.INT }}</p>
        <p>FOR: {{ player.FOR }}</p>
        <p>DEF: {{ player.DEF }}</p>
    </div>

    <div class="buttons">
        <a href="/atacar"><button>⚔️ Atacar</button></a>
        <a href="/curar"><button>✨ Curar</button></a>
        <a href="/reset"><button>🔄 Reset</button></a>
    </div>

</div>

</body>
</html>
